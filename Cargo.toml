[package]
name = "agentbox-mail"
version = "0.1.0"
edition = "2021"
authors = ["AgentBox Team"]
description = "High-performance autonomous AI Agent Mailbox & Automation Engine"

[dependencies]
# Async Runtime & HTTP Server
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Database & Persistence
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Email Parsing, IMAP Sync & Sending
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1.7"
webpki-roots = "0.26"

# Regex & Text Extraction
regex = "1.10"
scraper = "0.19"
once_cell = "1.19"

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "cargo"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.4"
mime_guess = "2.0"
